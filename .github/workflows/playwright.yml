name: Playwright tests

on:
  push:
    branches: [main, "debug/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The public demo sits behind Cloudflare, which answers GitHub runners with a bot
    # check (403 "Just a moment...") after login. CI runs the same app from its source
    # repository instead, so every test runs against a known, freshly seeded database.
    env:
      SPRINT: sprint5
      DISABLE_LOGGING: "true"
      UI_URL: http://localhost:4200
      API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v7

      - name: Check out the app under test
        uses: actions/checkout@v7
        with:
          repository: testsmith-io/practice-software-testing
          ref: ae7caecb811dd8952c09d997e69be7cb946ecd44
          path: app-under-test

      # no --wait: the one-off "composer" service exits by design, which --wait treats as a failure
      - name: Start app containers
        working-directory: app-under-test
        run: |
          docker compose up -d
          timeout 180 bash -c 'until docker compose exec -T laravel-api true; do sleep 3; done'

      # the compose file also has a one-off "composer" service installing into the same folder;
      # wait for it to exit so the two installs don't run at the same time
      - name: Install API dependencies
        working-directory: app-under-test
        run: |
          docker compose wait composer || true
          docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi > composer.log 2>&1 || {
            # job logs need a sign-in; an annotation shows the error on the public run page
            echo "::error title=composer install::$(tail -25 composer.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          # the install above runs as root; give the app user back the folders it writes to
          docker compose exec -T -u root laravel-api chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

      - name: Create and seed the database
        working-directory: app-under-test
        run: |
          timeout 120 bash -c 'until docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent; do sleep 2; done'
          docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for API and UI
        run: |
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:8091/status; do sleep 3; done'
          timeout 300 bash -c 'until curl -sf -o /dev/null http://localhost:4200; do sleep 5; done'
          # smoke check before the suite: stop here with the error page instead of 17 failing tests
          code=$(curl -s -o products.html -w '%{http_code}' 'http://localhost:8091/products?page=1')
          if [ "$code" != 200 ]; then
            echo "::error title=GET /products returned $code::$(sed 's/<[^>]*>//g' products.html | grep -v '^\s*$' | head -15 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: App logs on failure
        if: failure()
        working-directory: app-under-test
        run: docker compose logs --tail=100

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
